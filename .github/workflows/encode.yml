name: Encode Worker

on:
  push:
    branches:
      - main
    paths:
      - '_worker.js'
      - 'worker_converter.py'
      - '.github/workflows/encode.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  encode:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Encode Worker
        run: |
          python worker_converter.py encode -i _worker.js -o _worker.encode.js

      - name: Commit and push encoded worker
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add _worker.encode.js
          if git diff --staged --quiet; then
            echo "No changes in encoded worker."
          else
            git commit -m "Auto encode _worker.js via worker_converter [skip ci]"
            git push
          fi
