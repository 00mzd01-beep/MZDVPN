<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0d1117">
    <meta name="apple-mobile-web-app-title" content="MZDVPN">
    <meta name="format-detection" content="telephone=no">
    <meta name="msapplication-tap-highlight" content="no">
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%236366f1'/><text x='50' y='62' font-size='40' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>N</text></svg>">
    <title>MZDVPN Gateway</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'], fa: ['Vazirmatn', 'sans-serif'] },
                    colors: {
                        primary: 'var(--color-primary)',
                        darkbg: 'var(--color-bg)',
                        darkcard: 'var(--color-surface)',
                        darkborder: 'var(--color-border)',
                        white: '#ffffff',
                        black: '#000',
                        slate: {
                            50: 'var(--slate-50)',
                            100: 'var(--slate-100)',
                            200: 'var(--slate-200)',
                            300: 'var(--slate-300)',
                            400: 'var(--slate-400)',
                            500: 'var(--slate-500)',
                            600: 'var(--slate-600)',
                            700: 'var(--slate-700)',
                            800: 'var(--slate-800)',
                            900: 'var(--slate-900)',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        :root {
            --color-text: #0f172a;
            --color-text-muted: #475569;
            --color-primary: #6366f1; --color-primary-hover: #4f46e5;
            --color-bg: var(--slate-50);
            --color-surface: #ffffff;
            --color-bg-alt: var(--slate-100);
            --color-border: var(--slate-200);

            --slate-50: #f8fafc;
            --slate-100: #f1f5f9;
            --slate-200: #e2e8f0;
            --slate-300: #cbd5e1;
            --slate-400: #94a3b8;
            --slate-500: #64748b;
            --slate-600: #475569;
            --slate-700: #334155;
            --slate-800: #1e293b;
            --slate-900: #0f172a;
        }
        html.dark {
            --color-text: #f1f5f9;
            --color-text-muted: #cbd5e1;
            --color-primary: #818cf8; --color-primary-hover: #6366f1;
            --color-bg: var(--slate-900);
            --color-surface: var(--slate-800);
            --color-bg-alt: var(--slate-100);
            --color-border: var(--slate-200);

            --slate-50: #090d16;
            --slate-100: #151b26;
            --slate-200: #222b3c;
            --slate-300: #cbd5e1;
            --slate-400: #94a3b8;
            --slate-500: #64748b;
            --slate-600: #475569;
            --slate-700: #cbd5e1;
            --slate-800: #0f172a;
            --slate-900: #090d16;
        }
        html[lang="fa"] body, html[lang="fa"] body *:not(.font-mono) {
            font-family: 'Vazirmatn', sans-serif !important;
        }
        body {
            background: var(--color-bg);
            color: var(--color-text);
            font-family: 'Inter', sans-serif;
            transition: background 0.3s ease, color 0.3s ease;
        }
        input[type="text"]:not(.login-input), input[type="password"]:not(.login-input), select, textarea {
            background-color: var(--slate-100) !important;
            color: var(--slate-900) !important;
            border-color: var(--slate-200) !important;
            border-radius: 0.75rem !important;
        }
        html.dark input[type="text"]:not(.login-input), html.dark input[type="password"]:not(.login-input), html.dark select, html.dark textarea {
            background-color: var(--slate-100) !important;
            color: var(--slate-300) !important;
            border-color: var(--slate-200) !important;
        }
        select option { background-color: var(--slate-50) !important; color: var(--slate-900) !important; }
        html.dark select option { background-color: var(--slate-100) !important; color: var(--slate-300) !important; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 3px; }
        [data-accordion-content] { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
        .login-input { background-color: var(--color-bg-alt) !important; border-color: var(--color-border) !important; color: var(--color-text) !important; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .fade-in { animation: fadeIn 0.3s ease-out; }
    </style>
</head>
<body class="text-[var(--color-text)] h-[100dvh] flex flex-col md:flex-row overflow-hidden selection:bg-primary selection:text-white transition-colors duration-300 bg-[var(--color-bg)]">

    <!-- Global Controls -->
    <div class="fixed top-4 end-4 md:top-5 md:end-5 flex items-center gap-2 z-50">
        <span id="top-version-badge" class="hidden md:inline-block px-3 py-1.5 rounded-xl text-[11px] font-mono font-bold" style="background: color-mix(in srgb, var(--color-primary) 12%, transparent); border: 1px solid color-mix(in srgb, var(--color-primary) 25%, transparent); color: var(--color-primary);">v__CURRENT_VERSION__</span>
        
        <!-- دکمه تغییر زبان (فعال) -->
        <button onclick="toggleLang()" id="lang-toggle" class="px-3 py-1.5 rounded-xl text-sm font-bold transition-all shadow-sm cursor-pointer" style="background: var(--color-surface); border: 1px solid var(--color-border); color: var(--color-text);">EN</button>
        
        <!-- دکمه تغییر حالت روز/شب (فعال) -->
        <button onclick="toggleTheme()" class="p-2 rounded-xl transition-all shadow-sm cursor-pointer" style="background: var(--color-surface); border: 1px solid var(--color-border); color: #f59e0b;" title="Toggle Theme">
            <svg class="w-4 h-4 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
            <svg class="w-4 h-4 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        </button>

        <button onclick="logout()" id="btn-logout-mob" class="hidden md:hidden p-2 rounded-xl transition-all" style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);color:#f87171;">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
        </button>
    </div>

    <!-- LOGIN SCREEN -->
    <div id="login-box" class="absolute inset-0 flex items-center justify-center p-4 z-40 overflow-hidden" style="background: linear-gradient(135deg, var(--color-bg) 0%, var(--color-bg-alt) 50%, var(--color-bg) 100%);">
        <div class="absolute pointer-events-none rounded-full" style="width:500px;height:500px;top:-100px;left:-150px;background:radial-gradient(circle, var(--color-primary) 0%, transparent 65%); opacity: 0.12;"></div>
        <div class="absolute pointer-events-none rounded-full" style="width:400px;height:400px;bottom:-80px;right:-100px;background:radial-gradient(circle, var(--color-primary) 0%, transparent 65%); opacity: 0.1;"></div>
        <div class="relative w-full max-w-sm">
            
            <!-- Logo & Title Section -->
            <div class="text-center mb-8 flex flex-col items-center">
                <div class="relative w-24 h-24 rounded-full flex items-center justify-center overflow-hidden mb-4 shadow-xl" style="border: 2px solid var(--color-primary); box-shadow: 0 0 25px rgba(99, 102, 241, 0.3);">
                    <img src="https://raw.githubusercontent.com/00mzd01-beep/MZDVPN/main/download.png" alt="MZDVPN Logo" style="width: 100%; height: 100%; object-fit: cover;">
                </div>
                <h2 class="text-3xl font-black tracking-tight" style="color: var(--color-text);" data-i18n="title">MZDVPN</h2>
                <p class="text-sm mt-1.5" style="color: var(--color-text-muted);">Sign in to manage your gateway</p>
            </div>

            <div class="rounded-3xl p-px" style="background: linear-gradient(145deg, color-mix(in srgb, var(--color-primary) 45%, transparent), color-mix(in srgb, var(--color-primary) 8%, transparent) 50%, color-mix(in srgb, var(--color-primary) 30%, transparent)); box-shadow: 0 25px 60px rgba(0,0,0,0.15);">
                <div class="rounded-3xl p-8" style="background: var(--color-surface);">
                    <div class="flex items-center gap-2 mb-7 pb-6" style="border-bottom: 1px solid var(--color-border);">
                        <span class="w-2 h-2 rounded-full flex-shrink-0" style="background:#22c55e;box-shadow:0 0 8px #22c55e;"></span>
                        <span class="text-xs font-semibold text-emerald-500" data-i18n="system_online">System online</span>
                        <span class="flex-1"></span>
                        <span class="text-xs" style="color: var(--color-text-muted); opacity: 0.8;">🔒 Secure connection</span>
                    </div>
                    __HAS_DB_WARNING__
                    <div class="mb-5">
                        <label class="block text-sm font-semibold mb-2.5 text-start" style="color: var(--color-text-muted);" data-i18n="login_password">Password</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 start-0 flex items-center ps-4 text-primary">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
                            </div>
                            <input type="password" id="pwd" data-i18n="pass_ph" placeholder="Enter your password" class="login-input w-full ps-11 pe-12 py-3.5 text-sm rounded-2xl outline-none transition-all">
                            <button type="button" onclick="const n=document.getElementById('pwd');n.type=n.type==='password'?'text':'password'" class="eye-btn absolute inset-y-0 end-0 flex items-center px-4 transition-colors" style="color: var(--color-primary); opacity: 0.6;">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            </button>
                        </div>
                    </div>
                    <p id="err-msg" class="hidden text-sm mb-4 flex items-center gap-2 px-3 py-2.5 rounded-xl text-start" style="background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);color:#f87171;"><span>⚠️</span><span data-i18n="err_pass">Wrong password, please try again.</span></p>
                    <button onclick="doLogin()" class="login-btn w-full py-3.5 rounded-2xl font-bold text-sm relative overflow-hidden transition-all text-white cursor-pointer" style="background: linear-gradient(135deg, var(--color-primary), color-mix(in srgb, var(--color-primary) 80%, black)); box-shadow: 0 4px 24px color-mix(in srgb, var(--color-primary) 35%, transparent);" data-i18n="login_btn">
                        Sign In
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- DASHBOARD CONTAINER -->
    <div id="dash-box" class="hidden w-full h-full flex-col md:flex-row relative">
        <!-- پنل اصلی داشبورد -->
    </div>

    <script>
        let lang = localStorage.getItem('lang') || 'fa';

        // عملکرد دکمه تغییر زبان
        function toggleLang() {
            lang = lang === 'fa' ? 'en' : 'fa';
            localStorage.setItem('lang', lang);
            applyLang();
        }

        function applyLang() {
            document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
            document.documentElement.lang = lang;
            const btn = document.getElementById('lang-toggle');
            if(btn) btn.innerText = lang === 'fa' ? 'EN' : 'فا';

            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (window.i18n && window.i18n[lang] && window.i18n[lang][key]) {
                    if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
                        el.placeholder = window.i18n[lang][key];
                    } else {
                        el.innerText = window.i18n[lang][key];
                    }
                }
            });
        }

        // عملکرد دکمه روز و شب
        function toggleTheme() {
            const root = document.documentElement;
            if (root.classList.contains('dark')) {
                root.classList.remove('dark');
                localStorage.setItem('theme', 'light');
            } else {
                root.classList.add('dark');
                localStorage.setItem('theme', 'dark');
            }
        }

        // تنظیم اولیه تم و زبان در بارگذاری صفحه
        document.addEventListener('DOMContentLoaded', () => {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
            applyLang();
        });
    </script>
</body>
</html>
